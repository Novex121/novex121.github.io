<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novex Stream</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>NOVEX</h1>
        </div>

        <div class="header-controls">
            <!-- Language Selector -->
            <div class="lang-group">
                <select id="languageSelect" onchange="onLanguageChange()">
                    <option value="en-US">EN</option>
                    <option value="ja-JP">JP</option>
                    <option value="es-ES">ES</option>
                    <option value="fr-FR">FR</option>
                </select>
            </div>
            <!-- Search Form -->
            <form id="form">
                <input type="text" id="search" placeholder="Search..." class="search">
            </form>
        </div>
    </header>

    <!-- Hero Banner (MovieBox Style) -->
    <div id="hero-banner" class="hero-banner">
        <div class="hero-content">
            <span id="hero-badge" class="hero-badge">Trending Now</span>
            <h1 id="hero-title">Loading...</h1>
            <p id="hero-meta"></p>
            <button id="hero-play" class="hero-play-btn">▶ Play Now</button>
        </div>
    </div>

    <main id="main">
        <div id="content-container"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="loadAllCatalog()">
            <span class="icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="loadOnlyType('movie')">
            <span class="icon">🎬</span>
            <span>Movies</span>
        </div>
        <div class="nav-item" onclick="loadOnlyType('tv')">
            <span class="icon">📺</span>
            <span>Series & Anime</span>
        </div>
    </nav>
    
    <!-- Modal Video Player -->
    <div id="videoModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        
        <div id="playerBar" class="player-controls">
          <div id="tvControls" class="tv-controls-group" style="display: none;">
            <div class="control-group">
              <label for="seasonSelect">Season:</label>
              <select id="seasonSelect" onchange="onSeasonChange()"></select>
            </div>
            <div class="control-group">
              <label for="episodeSelect">Episode:</label>
              <select id="episodeSelect" onchange="onEpisodeChange()"></select>
            </div>
          </div>
          <div class="audio-sub-info">
            <span>⚙️ Audio (Dub/Sub) & CC inside player</span>
          </div>
        </div>

        <iframe id="player" src="" allowfullscreen frameborder="0"></iframe>
      </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
