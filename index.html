<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novex Stream</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>NOVEX</h1>
            <p>Movies, Series & Anime</p>
        </div>

        <div class="header-controls">
            <!-- Language Selector -->
            <div class="lang-group">
                <label for="languageSelect">🌐</label>
                <select id="languageSelect" onchange="onLanguageChange()">
                    <option value="en-US">English (US)</option>
                    <option value="ja-JP">日本語 (Japanese / Anime)</option>
                    <option value="es-ES">Español (Spanish)</option>
                    <option value="fr-FR">Français (French)</option>
                    <option value="de-DE">Deutsch (German)</option>
                    <option value="zh-CN">中文 (Chinese)</option>
                </select>
            </div>

            <!-- Search Form -->
            <form id="form">
                <input type="text" id="search" placeholder="Search movies, series, anime..." class="search">
            </form>
        </div>
    </header>

    <main id="main">
        <div id="content-container"></div>
    </main>
    
    <!-- Modal Video Player -->
    <div id="videoModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        
        <!-- Controls Bar for Seasons & Episodes -->
        <div id="playerBar" class="player-controls">
          <div id="tvControls" class="tv-controls-group" style="display: none;">
            <div class="control-group">
              <label for="seasonSelect">Season:</label>
              <select id="seasonSelect" onchange="onSeasonChange()"></select>
            </div>
            <div class="control-group">
              <label for="episodeSelect">Episode:</label>
              <select id="episodeSelect" onchange="onEpisodeChange()"></select>
            </div>
          </div>
          <div class="audio-sub-info">
            <span>💬 Audio (Dub/Sub) & Subtitles available in player settings (⚙️)</span>
          </div>
        </div>

        <iframe id="player" src="" allowfullscreen frameborder="0"></iframe>
      </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
