<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novex Stream - Watch Free Movies, Series & Anime</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Ad Network Scripts -->
  <script src="https://unfinishedspend.com/53/9c/55/539c556fd743dea59089c2354d827f1d.js"></script>
  <script src="https://unfinishedspend.com/67/58/cf/6758cfa8f5ad5df99658b05920501b79.js"></script>
</head>
<body>

  <!-- Top Navigation & Search -->
  <header class="app-header">
    <form id="form" class="search-bar-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search" placeholder="Search movies, series, anime, k-drama...">
    </form>
    
    <nav class="category-tabs">
      <button class="tab active" onclick="loadAllCatalog()">Trending</button>
      <button class="tab" onclick="loadOnlyType('movie')">Movie</button>
      <button class="tab" onclick="loadOnlyType('tv')">TV Series</button>
      <select id="languageSelect" onchange="onLanguageChange()" style="display:none;">
        <option value="en-US">English</option>
      </select>
    </nav>
  </header>

  <!-- Main Content Feed -->
  <main class="content-feed">
    <section class="hero-banner" id="hero-banner">
      <div class="hero-content">
        <h1 id="hero-title">Loading...</h1>
        <p id="hero-meta">⭐ -- | Loading...</p>
        <button id="hero-play" class="hero-play-btn"><i class="fa-solid fa-play"></i> Watch Now</button>
      </div>
    </section>

    <!-- Ad Banner Slot (160x300) -->
    <div class="ad-banner-wrapper" style="text-align: center; margin: 20px 0;">
      <script>
        atOptions = {
          'key' : '91d9be88fca3c09ba1c461db245c5eb0',
          'format' : 'iframe',
          'height' : 300,
          'width' : 160,
          'params' : {}
        };
      </script>
      <script src="https://unfinishedspend.com/91d9be88fca3c09ba1c461db245c5eb0/invoke.js"></script>
    </div>

    <div id="content-container"></div>
  </main>

  <!-- Expanded Full Screen Video Player Modal -->
  <div id="videoModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      
      <!-- TV / Anime Controls with Dub/Sub Switcher & Next Episode -->
      <div id="tvControls" class="tv-controls" style="display:none;">
        <select id="seasonSelect" onchange="onSeasonChange()"></select>
        <select id="episodeSelect" onchange="onEpisodeChange()"></select>
        
        <select id="audioTrackSelect" onchange="onAudioTrackChange()">
          <option value="dub">English Dub</option>
          <option value="sub" selected>Japanese/Original Audio (Sub)</option>
        </select>

        <button id="nextEpisodeBtn" class="next-ep-btn" onclick="playNextEpisode()">Next Ep <i class="fa-solid fa-forward"></i></button>
      </div>

      <div class="iframe-container">
        <iframe id="player" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active" onclick="loadAllCatalog()">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-compass"></i>
      <span>Explore</span>
    </a>
    <div class="nav-center-button">
      <div class="center-logo-circle">N</div>
    </div>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-bookmark"></i>
      <span>Saved</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>Me</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
