<head>

  <style>
    :root {
      --bg-color: #121212;
      --accent-red: #e50914;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }

    /* Header / Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo { color: var(--accent-red); font-size: 24px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .nav-actions { display: flex; gap: 15px; align-items: center; }
    
    .app-install-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .icon-nav-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .icon-nav-btn:hover { color: var(--accent-red); }

    /* Search Bar */
    .search-form { display: flex; gap: 5px; }
    .search-form input { padding: 8px 12px; border-radius: 4px; border: none; background: #222; color: white; width: 160px; transition: width 0.3s; }
    .search-form input:focus { width: 220px; outline: none; }
    .search-form button { padding: 8px 12px; background: var(--accent-red); color: white; border: none; border-radius: 4px; cursor: pointer; }

    /* Ad Banner Container */
    .ad-banner-container {
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background: #1a1a1a;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Hero Banner */
    #hero-banner {
      width: 100%;
      height: 450px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      background-image: linear-gradient(to top, #121212, rgba(18,18,18,0.4), transparent);
      transition: background-image 0.8s ease-in-out;
    }
    #hero-title { font-size: 38px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #hero-meta { color: var(--text-muted); margin-bottom: 15px; font-weight: 500; }
    .hero-buttons { display: flex; gap: 10px; }
    .hero-buttons button { padding: 10px 20px; background: var(--accent-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .hero-buttons button.secondary { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }

    /* Sections & Media Rows */
    .media-row-section { padding: 20px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-header h2 { font-size: 20px; border-left: 4px solid var(--accent-red); padding-left: 10px; }
    
    .horizontal-scroll-row {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }
    .horizontal-scroll-row::-webkit-scrollbar { height: 6px; }
    .horizontal-scroll-row::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    
    .media-card {
      min-width: 140px;
      width: 140px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .media-card:hover { transform: scale(1.05); }
    .media-card img { width: 100%; height: 210px; object-fit: cover; border-radius: 6px; }
    .media-card p { font-size: 14px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.8); color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; }

    /* Search History Chips */
    #searchHistoryContainer { padding: 10px 20px; display: none; }
    .search-chip { display: inline-block; background: #222; padding: 5px 10px; border-radius: 15px; margin-right: 5px; cursor: pointer; font-size: 13px; border: 1px solid #333; }

    /* Fullscreen Landscape Video Player Modal */
    #videoModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #videoModal .modal-content {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      padding: 10px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      z-index: 10001;
    }
    .modal-actions {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 10px 20px;
      z-index: 10000;
    }
    .modal-actions button { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
    
    #tvControls { display: flex; gap: 10px; padding: 0 20px 10px 20px; z-index: 10000; flex-wrap: wrap; align-items: center; }
    #tvControls select { padding: 6px 12px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
    
    .video-container { flex-grow: 1; width: 100%; height: 100%; }
    .video-container iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <a onclick="loadAllCatalog()" class="logo">NOVEX</a>
    <div class="nav-actions">
      <button id="installAppBtn" class="app-install-btn" onclick="installPWA()"><i class="fa-solid fa-download"></i> Install App</button>
      <button class="icon-nav-btn" onclick="loadWatchlist()" title="Watchlist"><i class="fa-solid fa-bookmark"></i></button>
      <button class="icon-nav-btn" onclick="loadFavorites()" title="Favorites"><i class="fa-solid fa-heart"></i></button>
      <button class="icon-nav-btn" onclick="loadDownloads()" title="Offline Downloads"><i class="fa-solid fa-cloud-arrow-down"></i></button>
    </div>
    <form class="search-form" id="form">
      <input type="text" id="search" placeholder="Search movies, anime...">
      <button type="submit"><i class="fa-solid fa-search"></i></button>
    </form>
  </header>

  <!-- Top Banner Ad Slot -->
  <div class="ad-banner-container" id="top-ad-slot">
    <script>
      atOptions = {
        'key' : 'b3e796a60be2875cd378f3f25245d082',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script src="https://unfinishedspend.com/b3e796a60be2875cd378f3f25245d082/invoke.js"></script>
    <div id="container-b69460673e31162a246da7f34c528460"></div>
  </div>

  <div id="searchHistoryContainer">
    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Recent Searches:</div>
    <div id="historyChips"></div>
  </div>

  <!-- Auto Sliding Hero Banner -->
  <div id="hero-banner">
    <div style="max-width: 650px;">
      <h1 id="hero-title">Resident Evil</h1>
      <p id="hero-meta">⭐ 7.3 | Series / Anime (Sub & Dub)</p>
      <div class="hero-buttons">
        <button id="hero-play"><i class="fa-solid fa-play"></i> Watch Now</button>
        <button class="secondary" id="hero-watchlist"><i class="fa-solid fa-plus"></i> Watchlist</button>
      </div>
    </div>
  </div>

  <main id="content-container"></main>

  <!-- Fullscreen Landscape Video Player Modal -->
  <div id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      
      <div class="modal-actions">
        <button id="modalDownloadBtn" onclick="toggleAppDownload()" title="Download to Offline App Storage"><i class="fa-solid fa-download"></i></button>
        <button id="modalFavoriteBtn" onclick="toggleFavorite()" title="Add to Favorites"><i class="fa-solid fa-heart"></i></button>
        <button id="modalWatchlistBtn" onclick="toggleWatchlist()" title="Add to Watchlist"><i class="fa-solid fa-bookmark"></i></button>
      </div>

      <div id="tvControls" style="display:none;">
        <select id="audioLangSelect" onchange="onAudioLangChange()">
          <option value="sub">Subbed (Original)</option>
          <option value="dub">Dubbed (English)</option>
        </select>
        <select id="seasonSelect" onchange="onSeasonChange()"></select>
        <select id="episodeSelect" onchange="onEpisodeChange()"></select>
      </div>

      <div class="video-container">
        <iframe id="player" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
