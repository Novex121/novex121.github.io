<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVEX Stream</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#760b0b">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PLACE YOUR AD NETWORK SCRIPTS HERE -->
  <!-- <script type="text/javascript" src="your-ad-script-url.js"></script> -->

  <style>
    :root {
      --bg-color: #121212;
      --accent-red: #e50914;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }

    /* Header / Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo { color: var(--accent-red); font-size: 24px; font-weight: bold; text-decoration: none; }
    .nav-links { display: flex; gap: 12px; align-items: center; }
    .nav-links button { background: none; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 15px; }
    .nav-links button:hover { color: var(--accent-red); }
    
    /* App Install Button Styling */
    #installAppBtn {
      background: var(--accent-red) !important;
      padding: 6px 12px;
      border-radius: 4px;
      display: none; /* Shown dynamically when PWA prompt is ready */
    }

    /* Search Bar */
    .search-form { display: flex; gap: 5px; }
    .search-form input { padding: 8px 12px; border-radius: 4px; border: none; background: #222; color: white; }
    .search-form button { padding: 8px 12px; background: var(--accent-red); color: white; border: none; border-radius: 4px; cursor: pointer; }

    /* Ad Banner Container */
    .ad-banner-container {
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background: #1a1a1a;
      min-height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hero Banner */
    #hero-banner {
      width: 100%;
      height: 400px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      background-image: linear-gradient(to top, #121212, transparent);
    }
    #hero-title { font-size: 36px; margin-bottom: 10px; }
    #hero-meta { color: var(--text-muted); margin-bottom: 15px; }
    .hero-buttons button { padding: 10px 20px; background: var(--accent-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Sections & Media Rows */
    .media-row-section { padding: 20px; }
    .section-header h2 { font-size: 20px; margin-bottom: 10px; border-left: 4px solid var(--accent-red); padding-left: 10px; }
    .horizontal-scroll-row {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }
    .horizontal-scroll-row::-webkit-scrollbar { height: 6px; }
    .horizontal-scroll-row::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    
    .media-card {
      min-width: 140px;
      width: 140px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .media-card:hover { transform: scale(1.05); }
    .media-card img { width: 100%; height: 210px; object-fit: cover; border-radius: 6px; }
    .media-card p { font-size: 14px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; }

    /* Search History Chips */
    #searchHistoryContainer { padding: 10px 20px; display: none; }
    .search-chip { display: inline-block; background: #222; padding: 5px 10px; border-radius: 15px; margin-right: 5px; cursor: pointer; font-size: 13px; }

    /* Fullscreen Landscape Video Player Modal */
    #videoModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #videoModal .modal-content {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      padding: 10px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      z-index: 10001;
    }
    .modal-actions {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 10px 20px;
      z-index: 10000;
    }
    .modal-actions button { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
    #tvControls { display: flex; gap: 10px; padding: 0 20px 10px 20px; z-index: 10000; }
    #tvControls select { padding: 5px 10px; background: #222; color: white; border: none; border-radius: 4px; }
    .video-container { flex-grow: 1; width: 100%; height: 100%; }
    .video-container iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <a href="./index.html" class="logo">NOVEX</a>
    <div class="nav-links">
      <button onclick="loadAllCatalog()">Home</button>
      <button onclick="loadDownloads()">📥 Downloads</button>
      <button id="installAppBtn" onclick="installPWA()">📲 Install App</button>
    </div>
    <form class="search-form" id="form">
      <input type="text" id="search" placeholder="Search movies, series...">
      <button type="submit"><i class="fa-solid fa-search"></i></button>
    </form>
  </header>

  <!-- Top Banner Ad Integration Slot -->
  <div class="ad-banner-container" id="top-ad-slot">
    <span style="color: var(--text-muted); font-size: 12px;">Advertisement Banner</span>
  </div>

  <div id="searchHistoryContainer">
    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Recent Searches:</div>
    <div id="historyChips"></div>
  </div>

  <div id="hero-banner">
    <div style="max-width: 600px;">
      <h1 id="hero-title">Loading...</h1>
      <p id="hero-meta">⭐ -- | Loading...</p>
      <div class="hero-buttons">
        <button id="hero-play"><i class="fa-solid fa-play"></i> Watch Now</button>
      </div>
    </div>
  </div>

  <main id="content-container"></main>

  <!-- Fullscreen Landscape Video Player Modal with Download Button -->
  <div id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      
      <div class="modal-actions">
        <!-- Media Download Button inside Player -->
        <button id="modalDownloadBtn" onclick="toggleAppDownload()" title="Download to App Storage">
          <i class="fa-solid fa-download"></i>
        </button>
      </div>

      <div id="tvControls" style="display:none;">
        <select id="seasonSelect" onchange="onSeasonChange()"></select>
        <select id="episodeSelect" onchange="onEpisodeChange()"></select>
      </div>

      <div class="video-container">
        <iframe id="player" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
