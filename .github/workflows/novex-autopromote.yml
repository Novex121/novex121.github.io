name: Novex AutoPromote

on:
  schedule:
    # 09:00 Africa/Lusaka (UTC+2)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novex-autopromote
  cancel-in-progress: false

jobs:
  generate-promotions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Novex Stream
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate WhatsApp-ready copy and Novex posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: node scripts/novex-autopromote.mjs

      - name: Save generated promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promotions/
          if git diff --cached --quiet; then
            echo "No promotion files changed."
          else
            git commit -m "Automate Novex promotional content"
            git push
          fi
